name: fits-previewer

# Triggers on push or pull request to main when this formula or workflow changes
on:
  push:
    paths:
    - 'fits-previewer.rb'
    - '.github/workflows/fits-previewer.yml'
    branches: [ main ]
  pull_request:
    paths:
    - 'fits-previewer.rb'
    - '.github/workflows/fits-previewer.yml'
    branches: [ main ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  install:
    # The type of runner that the job will run on
    runs-on: macos-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - uses: actions/checkout@v4

    - name: tap the repo
      run: brew tap danieljprice/all

    - name: install fits-previewer with homebrew
      run: brew install --cask fits-previewer
